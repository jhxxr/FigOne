name: FigOne Windows

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check Rust project
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Prepare check-only runtime placeholder
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force "engine/python" | Out-Null
          New-Item -ItemType File -Force "engine/python/python.exe" | Out-Null
          New-Item -ItemType File -Force "engine/python-runtime-cpu.zip" | Out-Null
          '{"formatVersion":1,"runtime":"windows-x64-cpu","fingerprint":"check-only"}' |
            Set-Content -Path "engine/python-runtime-cpu.manifest.json" -Encoding utf8

      - name: Check Tauri application
        run: cargo check --locked

      - name: Test CPU runtime helpers
        run: cargo test --locked

  build-installer:
    name: Build Windows x64 installer
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true

      - name: Build embedded CPU Python runtime
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $runtime = "engine/python"
          if (Test-Path $runtime) {
            Remove-Item $runtime -Recurse -Force
          }

          uv python install 3.12 --install-dir engine/.python-build
          $python = Get-ChildItem "engine/.python-build" -Filter python.exe -Recurse |
            Where-Object { $_.FullName -notmatch '\\Scripts\\' } |
            Select-Object -First 1
          if (-not $python) {
            throw "uv did not install a usable Python 3.12 runtime."
          }

          Copy-Item $python.Directory.FullName $runtime -Recurse

          # uv ships PEP 668 markers under Lib\ on Windows. Remove every copy so this
          # private bundled interpreter can be populated with FigOne's CPU deps.
          Get-ChildItem -Path $runtime -Filter EXTERNALLY-MANAGED -Recurse -Force -ErrorAction SilentlyContinue |
            Remove-Item -Force

          # Prefer an existing pip module; only bootstrap when the copied runtime lacks it.
          $pipProbe = & "$runtime/python.exe" -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('pip') else 1)"
          if ($LASTEXITCODE -ne 0) {
            & "$runtime/python.exe" -c "import ensurepip, sys; ensurepip.bootstrap(upgrade=True); print('ensurepip ready:', sys.executable)"
          }
          & "$runtime/python.exe" -m pip install --upgrade pip wheel "setuptools<81"
          & "$runtime/python.exe" -m pip install `
            --extra-index-url https://download.pytorch.org/whl/cpu `
            torch==2.7.1+cpu torchvision==0.22.1+cpu
          & "$runtime/python.exe" -m pip install -r engine/requirements-runtime.txt
          & "$runtime/python.exe" -m pip install --no-deps engine/sam3-src
          & "$runtime/python.exe" -c "import fastapi, torch, torchvision, transformers, einops, kornia, timm; assert torch.__version__.startswith('2.7.1') and '+cpu' in torch.__version__; assert torchvision.__version__.startswith('0.22.1') and '+cpu' in torchvision.__version__; assert not torch.cuda.is_available(); print('CPU core imports passed:', torch.__version__, torchvision.__version__)"
          & "$runtime/python.exe" -c "import torch; from torchvision.ops import roi_align; x=torch.randn(1,1,4,4); boxes=torch.tensor([[0,0,0,3,3]], dtype=torch.float32); y=roi_align(x, boxes, output_size=(2,2)); assert tuple(y.shape) == (1,1,2,2); print('TorchVision CPU operator passed')"
          & "$runtime/python.exe" -c "from pathlib import Path; import sam3; import sam3.model_builder; package=Path(sam3.__file__).resolve().parent; asset=package/'assets'/'bpe_simple_vocab_16e6.txt.gz'; assert asset.is_file(), asset; print('SAM3 package and BPE asset passed:', asset)"

          & "$PWD/scripts/prune_cpu_runtime.ps1" -Runtime $runtime
          & "$runtime/python.exe" -c "import sys; sys.path.insert(0, 'engine'); import server; capabilities=server._sam3_capabilities(); assert capabilities['supportsLocalCpu'], capabilities; assert server._resolve_svg_edit_path()[0]; print('FigOne CPU engine smoke test passed')"
          & "$runtime/python.exe" scripts/package_cpu_runtime.py --runtime $runtime --output engine/python-runtime-cpu.zip

          $runtimeFiles = Get-ChildItem $runtime -Recurse -File
          $runtimeBytes = ($runtimeFiles | Measure-Object -Property Length -Sum).Sum
          $archive = Get-Item "engine/python-runtime-cpu.zip"
          Write-Host ("CPU runtime inventory: {0} files, {1} bytes; archive {2} bytes" -f $runtimeFiles.Count, $runtimeBytes, $archive.Length)
          "### CPU runtime`n- Files: $($runtimeFiles.Count)`n- Uncompressed bytes: $runtimeBytes`n- Archive bytes: $($archive.Length)" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY

          # Drop the expanded runtime after packaging so the NSIS bundle only ships the ZIP.
          if (Test-Path $runtime) {
            Remove-Item $runtime -Recurse -Force
          }
          if (Test-Path "engine/.python-build") {
            Remove-Item "engine/.python-build" -Recurse -Force
          }

      - name: Verify packaged runtime
        shell: pwsh
        working-directory: .
        run: |
          $requiredFiles = @(
            "engine/server.py",
            "engine/autofigure2.py",
            "engine/web/index.html",
            "engine/web/import.html",
            "engine/web/canvas.html",
            "engine/web/history.html",
            "engine/web/startup.html",
            "engine/web/app.js",
            "engine/web/styles.css",
            "engine/web/vendor/svg-edit/editor/index.html",
            "engine/rmbg2-src/config.json",
            "engine/rmbg2-src/birefnet.py",
            "engine/rmbg2-src/BiRefNet_config.py",
            "engine/python-runtime-cpu.zip",
            "engine/python-runtime-cpu.manifest.json"
          )

          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path $_ -PathType Leaf) }
          if ($missingFiles.Count -gt 0) {
            $missingFiles | ForEach-Object {
              Write-Output "::error file=$_::Required installer resource is missing: $_"
            }
            throw "The CPU runtime or engine resources are incomplete. Refusing to create an installer that cannot start FigOne."
          }

          $manifest = Get-Content "engine/python-runtime-cpu.manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.runtime -ne "windows-x64-cpu" -or [string]::IsNullOrWhiteSpace($manifest.sha256)) {
            throw "The generated CPU runtime manifest is invalid."
          }
          if ((Get-Item "engine/python-runtime-cpu.zip").Length -le 0) {
            throw "The generated CPU runtime archive is empty."
          }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.11.4" --locked

      # Tauri downloads NSIS at bundle time from GitHub releases. That hop is flaky
      # on windows-latest ("io: Peer disconnected"). Seed the same cache path Tauri
      # uses so cargo tauri build skips the live download.
      - name: Pre-download NSIS toolchain
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = "Stop"
          $tauriTools = Join-Path $env:LOCALAPPDATA "tauri"
          $nsisDir = Join-Path $tauriTools "NSIS"
          $zipUrl = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"
          $dllUrl = "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
          $zipSha1 = "EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D"
          $dllSha1 = "75197FEE3C6A814FE035788D1C34EAD39349B860"

          function Get-FileSha1([string]$Path) {
            (Get-FileHash -Algorithm SHA1 -Path $Path).Hash.ToUpperInvariant()
          }

          function Invoke-DownloadWithRetry([string]$Url, [string]$OutFile, [string]$ExpectedSha1) {
            $maxAttempts = 6
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Write-Host "Downloading $Url (attempt $attempt/$maxAttempts)"
                if (Test-Path $OutFile) { Remove-Item $OutFile -Force }
                & curl.exe -L --fail --retry 5 --retry-all-errors --retry-delay 2 `
                  --connect-timeout 30 --max-time 180 `
                  -o $OutFile $Url
                if ($LASTEXITCODE -ne 0) {
                  throw "curl exited with code $LASTEXITCODE for $Url"
                }
                if (-not (Test-Path $OutFile)) {
                  throw "Download produced no file: $OutFile"
                }
                $actual = Get-FileSha1 $OutFile
                if ($actual -ne $ExpectedSha1) {
                  throw ("SHA1 mismatch for {0}: expected {1}, got {2}" -f $OutFile, $ExpectedSha1, $actual)
                }
                return
              } catch {
                Write-Warning $_
                if ($attempt -eq $maxAttempts) { throw }
                Start-Sleep -Seconds ([Math]::Min(30, 3 * $attempt))
              }
            }
          }

          New-Item -ItemType Directory -Force $tauriTools | Out-Null
          if (Test-Path $nsisDir) {
            Remove-Item $nsisDir -Recurse -Force
          }

          $zipPath = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
          $dllPath = Join-Path $env:RUNNER_TEMP "nsis_tauri_utils.dll"
          Invoke-DownloadWithRetry $zipUrl $zipPath $zipSha1
          Invoke-DownloadWithRetry $dllUrl $dllPath $dllSha1

          Expand-Archive -Path $zipPath -DestinationPath $tauriTools -Force
          $extracted = Join-Path $tauriTools "nsis-3.11"
          if (-not (Test-Path $extracted)) {
            throw "NSIS zip did not extract expected folder: $extracted"
          }
          Rename-Item $extracted $nsisDir

          $pluginDir = Join-Path $nsisDir "Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force $pluginDir | Out-Null
          Copy-Item $dllPath (Join-Path $pluginDir "nsis_tauri_utils.dll") -Force

          $required = @(
            "makensis.exe",
            "Bin\makensis.exe",
            "Plugins\x86-unicode\additional\nsis_tauri_utils.dll",
            "Include\MUI2.nsh"
          )
          foreach ($rel in $required) {
            $path = Join-Path $nsisDir $rel
            if (-not (Test-Path $path)) {
              throw "Seeded NSIS toolchain is missing: $path"
            }
          }
          Write-Host "NSIS toolchain ready at $nsisDir"

      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis --target x86_64-pc-windows-msvc --ci -- --locked

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FigOne-${{ github.ref_name }}-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: FigOne-${{ github.ref_name }}-windows-x64
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: FigOne ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.exe
